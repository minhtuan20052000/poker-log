<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Poker Log">
<meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Poker Log</title>
<style>
:root{
  color-scheme:light;
  --bg:#f2f2f0; --surface:#fcfcfb; --bar:rgba(248,248,246,.92);
  --text:#0b0b0b; --text2:#52514e; --muted:#8a8984; --line:#e4e3df; --grid:#ecebe7; --axis:#b9b8b2;
  --accent:#2a78d6; --good:#0a7a0a; --bad:#c42b2b;
  --s-chi:#eb6834; --s-thu:#2a78d6; --s-cum:#6250d6; --hl:rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f0f0e; --surface:#1a1a19; --bar:rgba(26,26,25,.92);
    --text:#f0efec; --text2:#c3c2b7; --muted:#8f8e86; --line:#2e2e2b; --grid:#272725; --axis:#4a4a46;
    --accent:#3987e5; --good:#45c145; --bad:#f07070;
    --s-chi:#d95926; --s-thu:#3987e5; --s-cum:#9085e9; --hl:rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f0f0e; --surface:#1a1a19; --bar:rgba(26,26,25,.92);
  --text:#f0efec; --text2:#c3c2b7; --muted:#8f8e86; --line:#2e2e2b; --grid:#272725; --axis:#4a4a46;
  --accent:#3987e5; --good:#45c145; --bad:#f07070;
  --s-chi:#d95926; --s-thu:#3987e5; --s-cum:#9085e9; --hl:rgba(255,255,255,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)} .zero{color:var(--text2)}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 6px}
header h1{margin:0 auto;max-width:640px;font-size:30px;font-weight:700;letter-spacing:-.5px}
main{max-width:640px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}

.card{background:var(--surface);border-radius:14px;padding:14px 16px;margin:12px 0}
.card h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);margin:0 0 10px}
.lbl{display:block;font-size:12px;color:var(--text2)}

.nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}
.nav button{width:44px;height:40px;border-radius:10px;font-size:26px;line-height:1;color:var(--accent)}
.nav button:active{background:var(--hl)}
.nav .title{width:auto;font-size:17px;font-weight:600;height:40px;padding:0 10px;color:var(--text);white-space:nowrap}

.seg{display:flex;background:var(--line);border-radius:9px;padding:2px;margin:8px 0}
.seg button{flex:1;padding:7px 0;border-radius:7px;font-size:14px;font-weight:500;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.sum .net b{display:block;font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.sum .row{display:flex;gap:12px;margin-top:12px}
.sum .row>div{flex:1;min-width:0}
.sum .row b{display:block;font-size:17px;font-weight:600;margin-top:2px}
.sum .meta{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--text2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.day{margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.day .d{font-size:14px;font-weight:600;color:var(--text2)}
.day .v{font-size:14px;font-weight:600}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.tour{display:flex;width:100%;text-align:left;gap:12px;padding:12px 16px;align-items:center}
.tour+.tour{border-top:1px solid var(--line)}
.tour:active{background:var(--hl)}
.tour .l{flex:1;min-width:0}
.tour .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour .sub{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour .r{text-align:right;flex-shrink:0}
.tour .r b{font-size:16px}
.empty{text-align:center;color:var(--text2);padding:40px 20px}

.legend{display:flex;gap:16px;font-size:13px;color:var(--text2);margin-bottom:6px}
.readout{font-size:13px;color:var(--text2);min-height:38px;margin-bottom:4px;line-height:1.45}
.readout b{color:var(--text);font-weight:600}
.chart{display:flex;position:relative}
.chart .yax{flex:0 0 40px}
.chart .scroll{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chart .scroll::-webkit-scrollbar{display:none}
.chart svg{display:block}
.chart text{font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart line.grid{stroke:var(--grid);stroke-width:1}
.chart line.zero{stroke:var(--axis);stroke-width:1}
.chart .hl{fill:var(--hl);opacity:0}
.chart .chi{fill:var(--s-chi)} .chart .thu{fill:var(--s-thu)}
.chart .cum{fill:none;stroke:var(--s-cum);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .mk{fill:var(--s-cum);stroke:var(--surface);stroke-width:2;opacity:0}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--text2);text-align:right;padding:6px 0;border-bottom:1px solid var(--line)}
td{text-align:right;padding:8px 0;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td.dim{color:var(--muted)}

.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--surface);color:var(--accent);font-weight:600;text-align:center;margin:8px 0}
.btn:active{background:var(--hl)}
.btn.danger{color:var(--bad)}
.note{font-size:13px;color:var(--text2);margin:6px 4px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:11px;font-weight:500;color:var(--muted)}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;z-index:11;right:20px;bottom:calc(72px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:32px;line-height:58px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab:active{transform:scale(.94)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;z-index:1}
.sheet-head b{font-size:17px}
.sheet-head button{color:var(--accent);font-size:17px;padding:4px 2px}
.sheet-head button.strong{font-weight:600}
.f{display:block;margin:12px 0}
.f>span{display:block;font-size:13px;color:var(--text2);margin:0 4px 5px}
.f input,.f textarea{display:block;width:100%;min-height:46px;font:inherit;font-size:17px;padding:11px 14px;border:0;border-radius:12px;background:var(--surface);color:var(--text);-webkit-appearance:none;appearance:none}
.f textarea{font-size:16px;resize:none}
.f input:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
.money-wrap{position:relative}
.money-wrap input{padding-right:40px}
.money-wrap i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted)}
.stepper{display:flex;align-items:center;background:var(--surface);border-radius:12px;height:50px}
.stepper button{width:64px;height:100%;font-size:26px;color:var(--accent)}
.stepper button:active{background:var(--hl)}
.stepper output{flex:1;text-align:center;font-size:20px;font-weight:600}
.preview{background:var(--surface);border-radius:12px;padding:12px 14px;margin:16px 0;font-size:14px;color:var(--text2)}
.preview div{display:flex;justify-content:space-between;padding:2px 0}
.preview b{color:var(--text)}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.login form{width:100%;max-width:360px}
.login .logo{width:72px;height:72px;margin:0 auto 10px;border-radius:18px;background:linear-gradient(#166e40,#083c24);color:#fff;font-size:42px;line-height:72px;text-align:center}
.login h2{text-align:center;margin:0 0 18px;font-size:24px}
.login .err{color:var(--bad);font-size:14px;min-height:20px;margin:4px 4px 8px}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text2)}
</style>
</head>
<body>
<header><h1 id="title">Nhật ký</h1></header>
<main id="main"></main>

<button class="fab" id="fab" aria-label="Thêm tour">+</button>

<nav class="tabbar">
  <button data-tab="log" class="on"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>Nhật ký</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Thống kê</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Cài đặt</button>
</nav>

<div class="overlay" id="sheet" hidden>
  <form class="sheet" id="form" autocomplete="off" novalidate>
    <div class="sheet-head">
      <button type="button" data-act="close">Huỷ</button>
      <b id="formTitle">Thêm tour</b>
      <button type="submit" class="strong">Lưu</button>
    </div>
    <label class="f"><span>Ngày chơi</span><input type="date" id="fDate" required></label>
    <label class="f"><span>Tên tour</span><input id="fName" list="names" placeholder="VD: Daily Deepstack" enterkeyhint="next"></label>
    <datalist id="names"></datalist>
    <div class="f"><span>Buy-in (mỗi lần)</span>
      <div class="money-wrap"><input id="fBuy" class="money" inputmode="numeric" placeholder="0"><i class="cur"></i></div>
      <div class="chips" id="buyChips"></div>
    </div>
    <div class="f"><span>Số lần re-buy / re-entry sau đó</span>
      <div class="stepper"><button type="button" data-step="-1" aria-label="Bớt">−</button><output id="fRe">0</output><button type="button" data-step="1" aria-label="Thêm">+</button></div>
    </div>
    <div class="f"><span>Thu về (tiền giải, 0 nếu bust)</span>
      <div class="money-wrap"><input id="fPrize" class="money" inputmode="numeric" placeholder="0"><i class="cur"></i></div>
    </div>
    <label class="f"><span>Ghi chú</span><textarea id="fNote" rows="2" placeholder="Hạng, số người chơi, hand đáng nhớ…"></textarea></label>
    <div class="preview" id="fPreview"></div>
    <button type="button" class="btn danger" id="fDel">Xoá tour này</button>
  </form>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<div class="login" id="login">
  <form id="loginForm" novalidate>
    <div class="logo">♠</div>
    <h2>Poker Log</h2>
    <label class="f"><span>Tài khoản</span><input id="lUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <label class="f"><span>Mật khẩu</span><input id="lPass" type="password" autocomplete="current-password"></label>
    <div class="err" id="lErr"></div>
    <button class="btn primary" type="submit" id="lBtn">Đăng nhập</button>
  </form>
</div>

<script>
'use strict';
/* ---------- storage ---------- */
const KEY = 'pokerlog.v1';
let db = load();
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.tours)) return {tours:d.tours.map(clean).filter(Boolean), settings:Object.assign({currency:'đ'}, d.settings)};
  }catch(e){}
  return {tours:[], settings:{currency:'đ'}};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('Không lưu được dữ liệu: ' + e.message); }
}
function clean(t){
  if(!t || typeof t.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(t.date)) return null;
  return {
    id: String(t.id || uid()), date: t.date, name: String(t.name || 'Tour').slice(0,80),
    buyIn: Math.max(0, +t.buyIn || 0), rebuys: Math.max(0, Math.floor(+t.rebuys || 0)),
    prize: Math.max(0, +t.prize || 0), note: String(t.note || '').slice(0,500), createdAt: +t.createdAt || Date.now()
  };
}
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('vi-VN');
const cur = () => db.settings.currency || '';
const money = n => fmt(n) + (cur() ? ' ' + cur() : '');
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + money(Math.abs(n));
const cls = n => n > 0 ? 'pos' : n < 0 ? 'neg' : 'zero';
const one = v => (Math.round(v*10)/10).toLocaleString('vi-VN');
function compact(n){
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if(a >= 1e9) return s + one(a/1e9) + ' tỷ';
  if(a >= 1e6) return s + one(a/1e6) + 'tr';
  if(a >= 1e3) return s + one(a/1e3) + 'k';
  return s + Math.round(a);
}
const parseMoney = s => +String(s).replace(/\D/g,'') || 0;
const cost = t => t.buyIn * (1 + t.rebuys);
const WD = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const dateObj = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const monthLabel = ym => { const [y,m] = ym.split('-'); return `Tháng ${+m}/${y}`; };
function shiftMonth(ym, k){ const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+k, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }

function sum(list){
  let chi = 0, thu = 0, itm = 0; const days = new Set();
  for(const t of list){ chi += cost(t); thu += t.prize; if(t.prize > 0) itm++; days.add(t.date); }
  return {chi, thu, net: thu - chi, n: list.length, itm, days: days.size};
}

/* ---------- UI state ---------- */
const ui = { tab:'log', month: today().slice(0,7), year: new Date().getFullYear(), mode:'day' };

function render(){
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  $('#title').textContent = {log:'Nhật ký', stats:'Thống kê', settings:'Cài đặt'}[ui.tab];
  $('#fab').hidden = ui.tab === 'settings';
  const m = $('#main');
  if(ui.tab === 'log') m.innerHTML = viewLog();
  else if(ui.tab === 'stats'){ m.innerHTML = viewStats(); drawStats(); }
  else m.innerHTML = viewSettings();
}

function summaryCard(s){
  const roi = s.chi ? Math.round(s.net / s.chi * 100) : 0;
  return `<section class="card sum">
    <div class="net"><span class="lbl">Lãi / lỗ</span><b class="num ${cls(s.net)}">${signed(s.net)}</b></div>
    <div class="row">
      <div><span class="lbl"><i class="dot" style="background:var(--s-chi)"></i>Chi ra</span><b class="num">${money(s.chi)}</b></div>
      <div><span class="lbl"><i class="dot" style="background:var(--s-thu)"></i>Thu về</span><b class="num">${money(s.thu)}</b></div>
    </div>
    <div class="meta">${s.n} tour · ${s.days} ngày chơi · ITM ${s.itm}/${s.n} · ROI <span class="${cls(roi)}">${roi > 0 ? '+' : ''}${roi}%</span></div>
  </section>`;
}
function monthNav(){
  return `<div class="nav"><button data-act="prevM" aria-label="Tháng trước">‹</button>
    <button class="title" data-act="thisM">${monthLabel(ui.month)}</button>
    <button data-act="nextM" aria-label="Tháng sau">›</button></div>`;
}
function yearNav(){
  return `<div class="nav"><button data-act="prevY" aria-label="Năm trước">‹</button>
    <button class="title" data-act="thisY">Năm ${ui.year}</button>
    <button data-act="nextY" aria-label="Năm sau">›</button></div>`;
}

/* ---------- Log view ---------- */
function viewLog(){
  const list = db.tours.filter(t => t.date.startsWith(ui.month))
    .sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  let h = monthNav() + summaryCard(sum(list));
  if(!list.length) return h + `<div class="empty">Chưa có tour nào trong tháng này.<br>Bấm <b>+</b> để thêm tour.</div>`;
  const groups = new Map();
  for(const t of list){ if(!groups.has(t.date)) groups.set(t.date, []); groups.get(t.date).push(t); }
  for(const [date, ts] of groups){
    const d = dateObj(date), s = sum(ts);
    h += `<div class="day"><span class="d">${WD[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}${date === today() ? ' · Hôm nay' : ''}</span>
      <span class="v num ${cls(s.net)}">${signed(s.net)}</span></div><div class="list">`;
    for(const t of ts){
      const net = t.prize - cost(t);
      const times = 1 + t.rebuys;
      h += `<button class="tour" data-id="${esc(t.id)}">
        <div class="l"><div class="name">${esc(t.name)}</div>
          <div class="sub num">${fmt(t.buyIn)}${times > 1 ? ` × ${times} lần (${t.rebuys} re-buy)` : ''}${t.note ? ' · ' + esc(t.note) : ''}</div></div>
        <div class="r"><b class="num ${cls(net)}">${signed(net)}</b>
          <div class="sub num">Chi ${compact(cost(t))}${t.prize ? ' · Thu ' + compact(t.prize) : ''}</div></div>
      </button>`;
    }
    h += `</div>`;
  }
  return h;
}

/* ---------- Stats view ---------- */
function buckets(){
  if(ui.mode === 'day'){
    const [y,m] = ui.month.split('-').map(Number);
    const n = new Date(y, m, 0).getDate();
    const chi = Array(n).fill(0), thu = Array(n).fill(0), cnt = Array(n).fill(0);
    const list = db.tours.filter(t => t.date.startsWith(ui.month));
    for(const t of list){ const i = +t.date.slice(8) - 1; chi[i] += cost(t); thu[i] += t.prize; cnt[i]++; }
    const now = new Date(); const isCur = now.getFullYear() === y && now.getMonth()+1 === m;
    const isFuture = new Date(y, m-1, 1) > now;
    return { list, n, chi, thu, cnt,
      last: isFuture ? -1 : isCur ? now.getDate()-1 : n-1, focus: isCur ? now.getDate()-1 : n-1,
      label: i => (i === 0 || (i+1) % 5 === 0) ? String(i+1) : null,
      name: i => { const d = new Date(y, m-1, i+1); return `${WD[d.getDay()]}, ${pad(i+1)}/${pad(m)}`; },
      rowName: i => `${pad(i+1)}/${pad(m)}` };
  }
  const y = ui.year, n = 12;
  const chi = Array(n).fill(0), thu = Array(n).fill(0), cnt = Array(n).fill(0);
  const list = db.tours.filter(t => t.date.startsWith(y + '-'));
  for(const t of list){ const i = +t.date.slice(5,7) - 1; chi[i] += cost(t); thu[i] += t.prize; cnt[i]++; }
  const now = new Date();
  return { list, n, chi, thu, cnt,
    last: y < now.getFullYear() ? 11 : y > now.getFullYear() ? -1 : now.getMonth(), focus: 0,
    label: i => 'T' + (i+1), name: i => `Tháng ${i+1}/${y}`, rowName: i => `Tháng ${i+1}` };
}

function viewStats(){
  const b = buckets();
  let h = `<div class="seg"><button data-act="modeDay" class="${ui.mode==='day'?'on':''}">Theo ngày</button><button data-act="modeMonth" class="${ui.mode==='month'?'on':''}">Theo tháng</button></div>`;
  h += (ui.mode === 'day' ? monthNav() : yearNav()) + summaryCard(sum(b.list));
  h += `<section class="card"><h2>Chi ra &amp; thu về ${ui.mode==='day'?'mỗi ngày':'mỗi tháng'}</h2>
    <div class="legend"><span><i class="dot" style="background:var(--s-chi)"></i>Chi ra</span><span><i class="dot" style="background:var(--s-thu)"></i>Thu về</span></div>
    <div class="readout" id="ro1">Chạm vào biểu đồ để xem chi tiết.</div>
    <div class="chart" id="c1"><div class="yax"></div><div class="scroll"></div></div></section>`;
  h += `<section class="card"><h2>Lãi / lỗ luỹ kế</h2>
    <div class="readout" id="ro2">Chạm vào biểu đồ để xem chi tiết.</div>
    <div class="chart" id="c2"><div class="yax"></div><div class="scroll"></div></div></section>`;
  // table
  const idx = [...Array(b.n).keys()].filter(i => ui.mode === 'month' || b.cnt[i] > 0);
  if(ui.mode === 'day') idx.reverse();
  h += `<section class="card"><h2>Chi tiết${cur() ? ' (' + esc(cur()) + ')' : ''}</h2>`;
  if(!b.list.length) h += `<div class="note">Chưa có dữ liệu.</div>`;
  else{
    h += `<table class="num"><tr><th>${ui.mode==='day'?'Ngày':'Tháng'}</th><th>Tour</th><th>Chi</th><th>Thu</th><th>Lãi/lỗ</th></tr>`;
    for(const i of idx){
      const net = b.thu[i] - b.chi[i], z = b.cnt[i] ? '' : ' class="dim"';
      h += `<tr><td${z}>${b.rowName(i)}</td><td${z}>${b.cnt[i]}</td><td${z}>${fmt(b.chi[i])}</td><td${z}>${fmt(b.thu[i])}</td><td class="${b.cnt[i] ? cls(net) : 'dim'}">${b.cnt[i] ? (net > 0 ? '+' : net < 0 ? '−' : '') + fmt(Math.abs(net)) : '–'}</td></tr>`;
    }
    h += `</table>`;
  }
  h += `</section>`;
  const all = sum(db.tours);
  h += `<section class="card"><h2>Từ trước đến nay</h2>
    <div style="display:flex;justify-content:space-between"><span>Tổng chi ra</span><b class="num">${money(all.chi)}</b></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px"><span>Tổng thu về</span><b class="num">${money(all.thu)}</b></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px"><span>Lãi / lỗ</span><b class="num ${cls(all.net)}">${signed(all.net)}</b></div>
    <div class="note" style="margin:10px 0 0">${all.n} tour · ${all.days} ngày chơi · ITM ${all.itm}/${all.n}</div></section>`;
  return h;
}

/* ---------- charts (hand-rolled SVG, works offline) ---------- */
const H = 190, PT = 10, PB = 22, PH = H - PT - PB, MIN_GROUP = 22;
function niceScale(lo, hi){
  if(lo === hi){ hi = lo + 1e6; }
  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, ticks = [];
  for(let v = a; v <= b + step/2; v += step) ticks.push(Math.round(v));
  return {lo:a, hi:b, ticks, y: v => PT + PH - (v - a) / (b - a) * PH};
}
function frame(root, n, sc){
  const box = root.querySelector('.scroll');
  const W = Math.max(box.clientWidth, n * MIN_GROUP), gw = W / n;
  root.querySelector('.yax').innerHTML = `<svg width="40" height="${H}">${sc.ticks.map(v => `<text x="34" y="${sc.y(v)+3.5}" text-anchor="end">${compact(v)}</text>`).join('')}</svg>`;
  const grid = sc.ticks.map(v => `<line x1="0" x2="${W}" y1="${sc.y(v)}" y2="${sc.y(v)}" class="${v === 0 ? 'zero' : 'grid'}"/>`).join('');
  return {box, W, gw, grid};
}
function xLabels(b, gw){
  let s = '';
  for(let i = 0; i < b.n; i++){ const l = b.label(i); if(l != null) s += `<text x="${(i+.5)*gw}" y="${H-6}" text-anchor="middle">${l}</text>`; }
  return s;
}
function barPath(x, base, w, h){
  if(h < 0.5) return '';
  const r = Math.min(4, w/2, h), t = base - h;
  return `M${x},${base}V${t+r}Q${x},${t} ${x+r},${t}H${x+w-r}Q${x+w},${t} ${x+w},${t+r}V${base}Z`;
}
function hover(root, n, gw, readout, text, onIdx){
  const svg = root.querySelector('.scroll svg'), hl = svg.querySelector('.hl');
  const pick = e => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(n-1, Math.floor((e.clientX - r.left) / gw)));
    hl.setAttribute('x', i*gw); hl.style.opacity = 1;
    readout.innerHTML = text(i); if(onIdx) onIdx(i);
  };
  svg.addEventListener('pointerdown', pick);
  svg.addEventListener('pointermove', e => { if(e.pointerType === 'mouse') pick(e); });
}

function drawStats(){
  const b = buckets();
  const tipLine = i => {
    const net = b.thu[i] - b.chi[i];
    return `<b>${b.name(i)}</b> · ${b.cnt[i]} tour<br><i class="dot" style="background:var(--s-chi)"></i>Chi <b class="num">${fmt(b.chi[i])}</b> &nbsp; <i class="dot" style="background:var(--s-thu)"></i>Thu <b class="num">${fmt(b.thu[i])}</b> &nbsp; <span class="num ${cls(net)}">${signed(net)}</span>`;
  };

  // 1) grouped bars: chi vs thu
  const c1 = $('#c1');
  const s1 = niceScale(0, Math.max(0, ...b.chi, ...b.thu) || 1e6);
  const f1 = frame(c1, b.n, s1), base = s1.y(0);
  const bw = Math.max(2, Math.min(16, (f1.gw - 8) / 2 - 1));
  let bars = '';
  for(let i = 0; i < b.n; i++){
    const x0 = i * f1.gw + (f1.gw - (bw*2 + 2)) / 2;
    bars += `<path class="chi" d="${barPath(x0, base, bw, base - s1.y(b.chi[i]))}"/>`;
    bars += `<path class="thu" d="${barPath(x0 + bw + 2, base, bw, base - s1.y(b.thu[i]))}"/>`;
  }
  f1.box.innerHTML = `<svg width="${f1.W}" height="${H}"><rect class="hl" x="0" y="${PT}" width="${f1.gw}" height="${PH}" rx="4"/>${f1.grid}${bars}${xLabels(b, f1.gw)}</svg>`;
  hover(c1, b.n, f1.gw, $('#ro1'), tipLine);

  // 2) cumulative net line
  const c2 = $('#c2');
  const cum = []; let acc = 0;
  for(let i = 0; i <= b.last; i++){ acc += b.thu[i] - b.chi[i]; cum.push(acc); }
  const s2 = niceScale(Math.min(0, ...cum), Math.max(0, ...cum));
  const f2 = frame(c2, b.n, s2);
  const pts = cum.map((v, i) => `${((i+.5)*f2.gw).toFixed(1)},${s2.y(v).toFixed(1)}`);
  f2.box.innerHTML = `<svg width="${f2.W}" height="${H}"><rect class="hl" x="0" y="${PT}" width="${f2.gw}" height="${PH}" rx="4"/>${f2.grid}
    ${pts.length ? `<path class="cum" d="M${pts.join('L')}"/>` : ''}<circle class="mk" r="5" cx="0" cy="0"/>${xLabels(b, f2.gw)}</svg>`;
  const mk = c2.querySelector('.mk');
  hover(c2, b.n, f2.gw, $('#ro2'), i => i < cum.length
      ? `<b>${b.name(i)}</b><br>Luỹ kế: <b class="num ${cls(cum[i])}">${signed(cum[i])}</b> · trong ${ui.mode==='day'?'ngày':'tháng'}: <span class="num ${cls(b.thu[i]-b.chi[i])}">${signed(b.thu[i]-b.chi[i])}</span>`
      : `<b>${b.name(i)}</b><br>Chưa tới.`,
    i => { if(i < cum.length){ mk.setAttribute('cx', (i+.5)*f2.gw); mk.setAttribute('cy', s2.y(cum[i])); mk.style.opacity = 1; } else mk.style.opacity = 0; });

  // keep the two charts scrolled together, start near today / latest
  const boxes = [f1.box, f2.box];
  const target = Math.max(0, (b.focus + .5) * f1.gw - f1.box.clientWidth * 0.75);
  boxes.forEach(x => x.scrollLeft = target);
  boxes.forEach((x, k) => x.addEventListener('scroll', () => { const o = boxes[1-k]; if(Math.abs(o.scrollLeft - x.scrollLeft) > 1) o.scrollLeft = x.scrollLeft; }, {passive:true}));
}

/* ---------- Settings ---------- */
function viewSettings(){
  return `<section class="card"><h2>Đơn vị tiền</h2>
      <label class="f" style="margin:0"><input id="setCur" value="${esc(cur())}" placeholder="đ" maxlength="6"></label></section>
    <section class="card"><h2>Sao lưu dữ liệu</h2>
      <div class="note" style="margin:0 0 8px">Dữ liệu chỉ nằm trên máy này. Nên xuất file sao lưu định kỳ (lưu vào Files / iCloud Drive).</div>
      <button class="btn" data-act="export" style="background:var(--bg)">Xuất file sao lưu (.json)</button>
      <button class="btn" data-act="csv" style="background:var(--bg)">Xuất bảng tính (.csv)</button>
      <button class="btn" data-act="import" style="background:var(--bg)">Khôi phục từ file sao lưu</button></section>
    <button class="btn" data-act="logout">Đăng xuất</button>
    <button class="btn danger" data-act="wipe">Xoá toàn bộ dữ liệu</button>
    <div class="note" style="text-align:center">${db.tours.length} tour đã lưu · Poker Log v1</div>`;
}
async function shareFile(name, text, type){
  const file = new File([text], name, {type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCSV(){
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const rows = [['Ngày','Tour','Buy-in','Số re-buy','Tổng chi','Thu về','Lãi/lỗ','Ghi chú']];
  [...db.tours].sort((a,b) => a.date.localeCompare(b.date)).forEach(t =>
    rows.push([t.date, t.name, t.buyIn, t.rebuys, cost(t), t.prize, t.prize - cost(t), t.note]));
  shareFile(`poker-log-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}

/* ---------- Form ---------- */
let editing = null, rebuys = 0;
const fBuy = $('#fBuy'), fPrize = $('#fPrize'), fName = $('#fName');
function setMoney(el, n){ el.value = n ? fmt(n) : ''; }
function openForm(t){
  editing = t || null;
  $('#formTitle').textContent = t ? 'Sửa tour' : 'Thêm tour';
  $('#fDate').value = t ? t.date : (ui.month === today().slice(0,7) ? today() : ui.month + '-01');
  fName.value = t ? t.name : '';
  setMoney(fBuy, t ? t.buyIn : 0); setMoney(fPrize, t ? t.prize : 0);
  rebuys = t ? t.rebuys : 0; $('#fNote').value = t ? t.note : '';
  $('#fDel').hidden = !t;
  document.querySelectorAll('.cur').forEach(e => e.textContent = cur());
  // name suggestions + recent buy-in chips
  const byName = new Map();
  [...db.tours].sort((a,b) => a.createdAt - b.createdAt).forEach(x => byName.set(x.name, x.buyIn));
  $('#names').innerHTML = [...byName.keys()].map(n => `<option value="${esc(n)}">`).join('');
  const recent = [...new Set([...db.tours].sort((a,b) => b.createdAt - a.createdAt).map(x => x.buyIn).filter(Boolean))].slice(0,5);
  $('#buyChips').innerHTML = recent.map(v => `<button type="button" data-buy="${v}" class="num">${compact(v)}</button>`).join('');
  updatePreview();
  $('#sheet').hidden = false;
  if(!t) setTimeout(() => fName.focus(), 250);
}
function closeForm(){ $('#sheet').hidden = true; document.activeElement && document.activeElement.blur(); }
function updatePreview(){
  $('#fRe').textContent = rebuys;
  const buy = parseMoney(fBuy.value), prize = parseMoney(fPrize.value), spent = buy * (1 + rebuys), net = prize - spent;
  $('#fPreview').innerHTML = `<div><span>Tổng chi (${1 + rebuys} lần buy-in)</span><b class="num">${money(spent)}</b></div>
    <div><span>Thu về</span><b class="num">${money(prize)}</b></div>
    <div><span>Lãi / lỗ</span><b class="num ${cls(net)}">${signed(net)}</b></div>`;
}
document.querySelectorAll('.money').forEach(el => el.addEventListener('input', () => {
  const n = parseMoney(el.value); el.value = n ? fmt(n) : '';
  updatePreview();
}));
fName.addEventListener('change', () => {
  const prev = [...db.tours].sort((a,b) => b.createdAt - a.createdAt).find(x => x.name === fName.value.trim());
  if(prev && !parseMoney(fBuy.value)){ setMoney(fBuy, prev.buyIn); updatePreview(); }
});
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const date = $('#fDate').value;
  if(!date){ alert('Chọn ngày chơi.'); return; }
  const buyIn = parseMoney(fBuy.value);
  if(!buyIn && !confirm('Buy-in đang là 0. Vẫn lưu?')) return;
  const t = clean({
    id: editing ? editing.id : uid(), createdAt: editing ? editing.createdAt : Date.now(),
    date, name: fName.value.trim() || 'Tour', buyIn, rebuys, prize: parseMoney(fPrize.value), note: $('#fNote').value.trim()
  });
  if(editing) db.tours[db.tours.findIndex(x => x.id === editing.id)] = t; else db.tours.push(t);
  save(); closeForm();
  ui.month = date.slice(0,7); ui.year = +date.slice(0,4);
  render();
});
$('#fDel').addEventListener('click', () => {
  if(!editing || !confirm(`Xoá tour "${editing.name}" ngày ${editing.date}?`)) return;
  db.tours = db.tours.filter(x => x.id !== editing.id); save(); closeForm(); render();
});
$('#sheet').addEventListener('click', e => { if(e.target.id === 'sheet') closeForm(); });

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if(tab){ ui.tab = tab.dataset.tab; render(); scrollTo(0,0); return; }
  const step = e.target.closest('[data-step]');
  if(step){ rebuys = Math.max(0, Math.min(99, rebuys + +step.dataset.step)); updatePreview(); return; }
  const chip = e.target.closest('[data-buy]');
  if(chip){ setMoney(fBuy, +chip.dataset.buy); updatePreview(); return; }
  const tour = e.target.closest('.tour');
  if(tour){ openForm(db.tours.find(x => x.id === tour.dataset.id)); return; }
  const act = e.target.closest('[data-act]'); if(!act) return;
  switch(act.dataset.act){
    case 'close': closeForm(); break;
    case 'prevM': ui.month = shiftMonth(ui.month, -1); render(); break;
    case 'nextM': ui.month = shiftMonth(ui.month, 1); render(); break;
    case 'thisM': ui.month = today().slice(0,7); render(); break;
    case 'prevY': ui.year--; render(); break;
    case 'nextY': ui.year++; render(); break;
    case 'thisY': ui.year = new Date().getFullYear(); render(); break;
    case 'modeDay': ui.mode = 'day'; render(); break;
    case 'modeMonth': ui.mode = 'month'; ui.year = +ui.month.slice(0,4); render(); break;
    case 'export': shareFile(`poker-log-${today()}.json`, JSON.stringify({app:'poker-log', version:1, exportedAt:new Date().toISOString(), ...db}, null, 1), 'application/json'); break;
    case 'csv': exportCSV(); break;
    case 'import': $('#importFile').click(); break;
    case 'logout':
      if(confirm('Đăng xuất? Dữ liệu vẫn được giữ trên máy.')){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} location.reload(); }
      break;
    case 'wipe':
      if(confirm('Xoá TOÀN BỘ dữ liệu? Không thể hoàn tác.\nHãy chắc chắn đã xuất file sao lưu.') && confirm('Xác nhận lần cuối: xoá hết?')){
        db.tours = []; save(); render();
      }
      break;
  }
});
$('#fab').addEventListener('click', () => openForm());
document.addEventListener('change', e => {
  if(e.target.id === 'setCur'){ db.settings.currency = e.target.value.trim(); save(); }
});
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  try{
    const d = JSON.parse(await file.text());
    const arr = Array.isArray(d) ? d : d.tours;
    if(!Array.isArray(arr)) throw new Error('File không đúng định dạng.');
    const tours = arr.map(clean).filter(Boolean);
    if(!confirm(`Thay ${db.tours.length} tour hiện có bằng ${tours.length} tour từ file?`)) return;
    db.tours = tours; if(d.settings) db.settings = Object.assign({currency:'đ'}, d.settings);
    save(); render(); alert('Đã khôi phục ' + tours.length + ' tour.');
  }catch(err){ alert('Không đọc được file: ' + err.message); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if(ui.tab === 'stats') render(); }, 200); });

/* ---------- login ----------
   Chỉ lưu mã băm PBKDF2 (có salt) của "tài khoản + mật khẩu", không lưu mật khẩu thô.
   Đổi tài khoản/mật khẩu: xem HUONG-DAN.md. */
const AUTH = {
  salt: 'd4e3d4f7354c56eaf2ef52eabfcd1fb8',
  hash: '274ead801a548e54a84cb8d1df36a766e40dd9052d60dc2b3af507bb90110faf',
  iter: 200000
};
const AUTH_KEY = 'pokerlog.auth';
async function deriveLogin(user, pass){
  const enc = new TextEncoder();
  const salt = new Uint8Array(AUTH.salt.match(/../g).map(h => parseInt(h, 16)));
  const key = await crypto.subtle.importKey('raw', enc.encode(user.trim().toLowerCase() + '\n' + pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt, iterations:AUTH.iter}, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function isAuthed(){ try{ return localStorage.getItem(AUTH_KEY) === AUTH.hash; }catch(e){ return false; } }
function unlock(){ $('#login').hidden = true; render(); }
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('#lErr'), btn = $('#lBtn');
  if(!window.crypto || !crypto.subtle){ err.textContent = 'Cần mở app qua địa chỉ https.'; return; }
  btn.disabled = true; err.textContent = '';
  try{
    const h = await deriveLogin($('#lUser').value, $('#lPass').value);
    if(h === AUTH.hash){
      try{ localStorage.setItem(AUTH_KEY, h); }catch(_){}
      $('#lPass').value = ''; document.activeElement && document.activeElement.blur();
      unlock();
    } else { err.textContent = 'Sai tài khoản hoặc mật khẩu.'; $('#lPass').value = ''; }
  }catch(ex){ err.textContent = 'Lỗi: ' + ex.message; }
  btn.disabled = false;
});

if(isAuthed()) unlock();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
